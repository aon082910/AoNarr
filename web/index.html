<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161b22" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>AoNarr</title>
    <script>
      // Applied before React renders to avoid a flash of the wrong theme/layout on load.
      try {
        var t = localStorage.getItem("aonarr_theme");
        if (t === "light") document.documentElement.setAttribute("data-theme", "light");
        var w = localStorage.getItem("aonarr_layout_width");
        if (w === "full") document.documentElement.setAttribute("data-layout-width", "full");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
